[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-bucket-bandwidth-regulator"
version = "0.1.0"
description = "Dynamic token bucket bandwidth regulator smoothing bursty LLM requests across multi-tier rate limits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
token-bucket-bandwidth-regulator = "token_bucket_bandwidth_regulator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["token_bucket_bandwidth_regulator*"]
